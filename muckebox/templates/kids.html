<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Muckebox">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#1d3557">
  <title>Muckebox</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="stylesheet" href="/static/css/fonts.css?v={{ asset_version }}">
  <link rel="stylesheet" href="/static/css/kids.css?v={{ asset_version }}">
  <script type="module" src="/static/js/kids.js?v={{ asset_version }}"></script>
</head>
<body class="kids" data-profile="{{ profile }}" data-skip="{{ 'on' if skip_buttons else 'off' }}" data-asset-version="{{ asset_version }}">
  <script id="i18n" type="application/json">{{ messages|tojson }}</script>

  <div class="stage">
    <!-- "Groß": what is playing, with its controls (moved here by kids.js) -->
    <aside id="now" class="now" aria-live="polite">
      <div id="now-art" class="now-art">
        <img id="now-cover" class="now-cover" alt="" hidden>
        <img id="now-picture" class="now-picture" alt="" src="/static/pictures/moon.svg">
      </div>
      <div class="now-text">
        <p id="now-label" class="now-label"></p>
        <p id="now-title" class="now-title"></p>
        <p id="now-sub" class="now-sub"></p>
      </div>
      <div id="now-progress" class="now-progress" hidden>
        <div class="now-bar"><i id="now-bar"></i></div>
        <div class="now-times"><span id="now-position"></span><span id="now-duration"></span></div>
      </div>
      <div id="now-buttons" class="now-buttons"></div>
      <div class="now-fill"></div>
      <div id="now-volume" class="now-volume"></div>
    </aside>

    <section class="library">
      <header class="library-head">
        <h1 class="library-title" data-i18n="kids.my_music"></h1>
        <span class="spacer"></span>
        <div id="head-slot" class="head-slot"></div>
      </header>

      <div id="lights" class="lights" data-i18n-label="kids.light" role="group" hidden></div>

      <div class="pager">
        <main id="tiles" class="tiles"></main>
        <button id="page-prev" class="page-arrow page-prev" type="button" data-i18n-label="kids.page_prev" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
        </button>
        <button id="page-next" class="page-arrow page-next" type="button" data-i18n-label="kids.page_next" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6 8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
        </button>
        <div id="page-dots" class="page-dots" aria-hidden="true"></div>

        <!-- "Klein": the playing tile, big; a tap pauses, the house goes back -->
        <section id="playing" class="now-view" hidden>
          <button id="home" class="home" type="button" data-i18n-label="kids.home">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
          </button>
          <button id="playing-art" class="playing-art" type="button" data-i18n-label="kids.pause">
            <img id="playing-cover" class="playing-cover" alt="" hidden>
            <img id="playing-picture" class="playing-picture" alt="">
            <span class="playing-paused" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </span>
          </button>
        </section>

        <section id="bedtime" class="bedtime" hidden>
          <button id="moon" class="moon" type="button" data-i18n-label="kids.bedtime">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.34 2.02C6.59 1.82 2 6.42 2 12c0 5.52 4.48 10 10 10 3.71 0 6.93-2.02 8.66-5.02-7.51-.25-12.09-8.43-8.32-14.96"/></svg>
          </button>
          <p class="bedtime-text" data-i18n="kids.bedtime"></p>
          <p id="bedtime-until" class="bedtime-until"></p>
          <button id="bedtime-breathing" class="bedtime-breathing" type="button" hidden>
            <img src="/static/pictures/breathing.svg" alt="">
            <span data-i18n="game.breathing"></span>
          </button>
        </section>

        <p id="empty" class="empty" hidden>
          <svg class="empty-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3z"/></svg>
          <span data-i18n="kids.empty"></span>
        </p>
      </div>
    </section>
  </div>

  <!-- "Klein": the control bar. kids.js moves the buttons into the slots of the
       current layout; the buttons themselves exist only once. -->
  <nav id="bar" class="controls" aria-label="">
    <div id="bar-left" class="bar-group bar-left">
      <button id="small-moon" class="control small-moon" type="button" data-i18n-label="kids.sleep_timer" hidden>
        <svg class="ring" viewBox="0 0 36 36" aria-hidden="true"><circle class="ring-track" cx="18" cy="18" r="16"/><circle id="ring-fill" class="ring-fill" cx="18" cy="18" r="16" pathLength="100"/></svg>
        <svg class="moon-shape" viewBox="0 0 24 24" aria-hidden="true"><path d="M12.34 2.02C6.59 1.82 2 6.42 2 12c0 5.52 4.48 10 10 10 3.71 0 6.93-2.02 8.66-5.02-7.51-.25-12.09-8.43-8.32-14.96"/></svg>
      </button>
      <button id="games-button" class="control games-button" type="button" data-i18n-label="kids.games" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 11H19V7a2 2 0 0 0-2-2h-4V3.5a2.5 2.5 0 0 0-5 0V5H4a2 2 0 0 0-2 2v3.8h1.5a2.7 2.7 0 0 1 0 5.4H2V20a2 2 0 0 0 2 2h3.8v-1.5a2.7 2.7 0 0 1 5.4 0V22H17a2 2 0 0 0 2-2v-4h1.5a2.5 2.5 0 0 0 0-5"/></svg>
        <span class="games-label" data-i18n="kids.games"></span>
      </button>
    </div>
    <div id="bar-volume" class="bar-group bar-volume">
      <button id="quieter" class="control control-volume" type="button" data-i18n-label="kids.quieter">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9v6h4l5 5V4L9 9z"/></svg>
      </button>
      <div id="volume" class="volume" role="meter" aria-valuemin="0" data-i18n-label="kids.volume"></div>
      <button id="louder" class="control control-volume" type="button" data-i18n-label="kids.louder">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05A4.5 4.5 0 0 0 16.5 12M14 3.23v2.06a7 7 0 0 1 0 13.42v2.06A9 9 0 0 0 14 3.23"/></svg>
      </button>
    </div>
    <div id="bar-play" class="bar-group bar-play">
      <button id="prev" class="control control-skip" type="button" data-i18n-label="kids.previous">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
      </button>
      <button id="toggle" class="control control-main" type="button" data-i18n-label="kids.play">
        <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 19h4V5H6zm8-14v14h4V5z"/></svg>
      </button>
      <button id="next" class="control control-skip" type="button" data-i18n-label="kids.next">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 18l8.5-6L6 6zm10-12v12h2V6z"/></svg>
      </button>
    </div>
  </nav>

  <div id="overlay" class="overlay" hidden>
    <svg class="overlay-icon" data-kind="offline" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.35 10.04A7.49 7.49 0 0 0 12 4C9.11 4 6.6 5.64 5.35 8.04A6 6 0 0 0 6 20h13a5 5 0 0 0 .35-9.96M15.5 17 12 13.5 8.5 17 7 15.5l3.5-3.5L7 8.5 8.5 7l3.5 3.5L15.5 7 17 8.5 13.5 12l3.5 3.5z"/></svg>
    <svg class="overlay-icon" data-kind="sleeping" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 2H7a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2m-5 2a2 2 0 1 1 0 4 2 2 0 0 1 0-4m0 16a5 5 0 1 1 0-10 5 5 0 0 1 0 10m0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6"/></svg>
    <svg class="overlay-icon" data-kind="config" viewBox="0 0 24 24" aria-hidden="true"><path d="m22.7 19-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4"/></svg>
    <p id="overlay-text"></p>
  </div>

  <div id="game-layer" class="game-layer" hidden>
    <button id="game-close" class="game-close" type="button" data-i18n-label="kids.game_close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
    </button>
    <div id="game-picker" class="game-picker" hidden></div>
    <div id="game-stage" class="game-stage" hidden></div>
  </div>

  <div id="pin-pad" class="pin-pad" role="dialog" aria-modal="true" aria-labelledby="pad-title" hidden>
    <div class="pad-card">
      <p id="pad-title" class="pad-title" data-i18n="kids.pad_title"></p>
      <p id="pad-dots" class="pad-dots" aria-live="polite"></p>
      <div id="pad-keys" class="pad-keys"></div>
      <div class="pad-choices">
        <button type="button" data-choice="15" data-i18n="kids.pad_15"></button>
        <button type="button" data-choice="30" data-i18n="kids.pad_30"></button>
        <button type="button" data-choice="60" data-i18n="kids.pad_60"></button>
        <button type="button" data-choice="morning" data-i18n="kids.pad_morning"></button>
      </div>
      <p id="pad-message" class="pad-message" role="alert" hidden></p>
      <button id="pad-close" type="button" class="pad-close" data-i18n="kids.pad_close"></button>
    </div>
  </div>

  <div id="toast" class="toast" role="status" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20m1 15h-2v-2h2zm0-4h-2V7h2z"/></svg>
    <span id="toast-text"></span>
  </div>

  <template id="replay-icon">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05A4.5 4.5 0 0 0 16.5 12M14 3.23v2.06a7 7 0 0 1 0 13.42v2.06A9 9 0 0 0 14 3.23"/></svg>
  </template>

  <template id="tile-template">
    <button class="tile" type="button">
      <span class="art">
        <img class="cover" alt="" loading="lazy" decoding="async">
        <img class="picture" alt="" decoding="async">
        <span class="progress" aria-hidden="true" hidden><i></i></span>
        <span class="badge-pending" aria-hidden="true"></span>
      </span>
      <span class="title"></span>
    </button>
  </template>
</body>
</html>
