<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1d3557">
  <title>Muckebox</title>
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="stylesheet" href="/static/css/admin.css?v={{ asset_version }}">
  <script type="module" src="/static/js/admin.js?v={{ asset_version }}"></script>
</head>
<body class="admin">
  <script id="i18n" type="application/json">{{ messages|tojson }}</script>
  <header>
    <h1 data-i18n="admin.title"></h1>
    <nav>
      <a href="/" data-i18n="admin.kids_view"></a>
      <button id="logout" type="button" class="link" data-i18n="admin.logout" hidden></button>
    </nav>
  </header>

  <div id="flash" class="flash" role="status" hidden></div>

  <form id="login" class="card login" hidden>
    <label for="pin" data-i18n="admin.pin"></label>
    <input id="pin" name="pin" type="password" autocomplete="current-password" required>
    <button type="submit" data-i18n="admin.login"></button>
    <p class="hint"><span data-i18n="admin.login_hint"></span>
      <code class="command">python -m muckebox.admin reset-pin</code></p>
  </form>

  <main id="app" hidden>
    <p id="pin-banner" class="card banner" hidden>
      <span data-i18n="admin.pin_banner"></span>
      <a href="#pin-section" data-i18n="admin.pin_banner_link"></a>
    </p>

    <section class="card">
      <h2 data-i18n="admin.status"></h2>
      <dl id="status" class="status"></dl>
      <ul id="problems" class="problems"></ul>
      <p id="zone-hint" class="zone-hint" hidden>
        <span id="zone-text"></span>
        <button id="zone-adopt" type="button" class="secondary"></button>
      </p>
    </section>

    <section id="setup" class="card">
      <h2 data-i18n="admin.setup"></h2>
      <p id="room-current"></p>
      <form id="room-search" class="room-search">
        <label for="seed-ip" data-i18n="admin.seed_ip"></label>
        <p class="hint" data-i18n="admin.seed_ip_hint"></p>
        <div class="inline">
          <input id="seed-ip" name="seed_ip" inputmode="url" autocapitalize="off" autocomplete="off" spellcheck="false" data-i18n-placeholder="admin.seed_ip_placeholder">
          <button type="submit" class="secondary" data-i18n="admin.search_rooms"></button>
        </div>
      </form>
      <ul id="rooms" class="rooms" aria-live="polite"></ul>
      <p class="hint" data-i18n="admin.room_hint"></p>
    </section>

    <section class="card">
      <h2 data-i18n="admin.tiles"></h2>
      <p id="tiles-empty" class="hint" data-i18n="admin.tiles_empty" hidden></p>
      <ol id="tiles" class="tiles"></ol>
    </section>

    <section id="favorites-section" class="card">
      <div class="section-head">
        <h2 data-i18n="admin.favorites"></h2>
        <button id="refresh" type="button" class="secondary" data-i18n="admin.refresh"></button>
      </div>
      <p class="hint" data-i18n="admin.favorites_hint"></p>
      <p id="favorites-no-room" class="hint" data-i18n="admin.favorites_no_room" hidden></p>
      <ul id="favorites" class="favorites"></ul>
    </section>

    <section class="card">
      <h2 data-i18n="admin.link"></h2>
      <p class="hint" data-i18n="admin.link_hint"></p>
      <form id="link" class="link-form">
        <input id="link-url" name="url" type="url" required data-i18n-placeholder="admin.link_placeholder">
        <button type="submit" data-i18n="admin.add"></button>
      </form>
    </section>

    <section class="card">
      <h2 data-i18n="admin.volume"></h2>
      <form id="volume" class="fields">
        <label for="max-volume" data-i18n="admin.max_volume"></label>
        <input id="max-volume" name="max_volume" type="number" min="1" max="100" step="1" inputmode="numeric" required>
        <label for="volume-step" data-i18n="admin.volume_step"></label>
        <input id="volume-step" name="volume_step" type="number" min="1" max="100" step="1" inputmode="numeric" required>
        <p class="hint" data-i18n="admin.volume_hint"></p>
        <button type="submit" data-i18n="admin.save"></button>
      </form>
    </section>

    <section class="card">
      <h2 data-i18n="admin.controls"></h2>
      <form id="controls" class="fields">
        <label for="tap-cooldown" data-i18n="admin.tap_cooldown"></label>
        <input id="tap-cooldown" name="tap_cooldown" type="number" min="0" max="30" step="1" inputmode="numeric" required>
        <label for="idle-minutes" data-i18n="admin.idle_minutes"></label>
        <input id="idle-minutes" name="idle_minutes" type="number" min="0" max="240" step="5" inputmode="numeric" required>
        <p class="hint" data-i18n="admin.controls_hint"></p>
        <button type="submit" data-i18n="admin.save"></button>
      </form>
    </section>

    <section id="schedule-section" class="card">
      <h2 data-i18n="admin.schedule"></h2>
      <p id="schedule-status" class="schedule-status"></p>
      <div id="override-buttons" class="override-buttons">
        <button type="button" class="secondary" data-override="15" data-i18n="admin.override_15"></button>
        <button type="button" class="secondary" data-override="30" data-i18n="admin.override_30"></button>
        <button type="button" class="secondary" data-override="60" data-i18n="admin.override_60"></button>
        <button type="button" class="secondary" data-override="morning" data-i18n="admin.override_morning"></button>
        <button id="override-end" type="button" class="secondary" data-i18n="admin.override_end" hidden></button>
      </div>
      <form id="schedule" class="fields schedule-form">
        <label class="check"><input id="schedule-enabled" type="checkbox"> <span data-i18n="admin.schedule_enabled"></span></label>
        <div id="days" class="days"></div>
        <button id="copy-monday" type="button" class="link" data-i18n="admin.copy_monday"></button>
        <label for="fade-minutes" data-i18n="admin.fade_minutes"></label>
        <input id="fade-minutes" type="number" min="0" max="30" step="1" inputmode="numeric" required>
        <p class="hint" data-i18n="admin.schedule_hint"></p>
        <button type="submit" data-i18n="admin.save"></button>
      </form>
    </section>

    <section id="sleep-section" class="card">
      <h2 data-i18n="admin.sleep_timer"></h2>
      <p id="sleep-status" class="schedule-status" hidden></p>
      <button id="sleep-cancel" type="button" class="secondary" data-i18n="admin.sleep_cancel" hidden></button>
      <form id="sleep-timer" class="fields">
        <label class="check"><input id="sleep-enabled" type="checkbox"> <span data-i18n="admin.sleep_enabled"></span></label>
        <label for="sleep-minutes" data-i18n="admin.sleep_minutes"></label>
        <input id="sleep-minutes" type="number" min="5" max="90" step="5" inputmode="numeric" required>
        <label for="sleep-wake" data-i18n="admin.sleep_wake"></label>
        <input id="sleep-wake" type="time" step="300" required>
        <p class="hint" data-i18n="admin.sleep_hint"></p>
        <button type="submit" data-i18n="admin.save"></button>
      </form>
    </section>

    <section id="games-section" class="card">
      <h2 data-i18n="admin.games"></h2>
      <p id="games-status" class="schedule-status"></p>
      <form id="games" class="fields games-form">
        <div id="game-rows" class="game-rows"></div>
        <label for="games-minutes" data-i18n="admin.games_minutes"></label>
        <input id="games-minutes" type="number" min="5" max="60" step="5" inputmode="numeric" required>
        <label for="dance-tile" data-i18n="admin.dance_tile"></label>
        <select id="dance-tile"></select>
        <p class="hint" data-i18n="admin.games_hint"></p>
        <button type="submit" data-i18n="admin.save"></button>
      </form>
      <details id="credits" class="credits">
        <summary data-i18n="admin.credits"></summary>
        <ul id="credits-list"></ul>
      </details>
    </section>

    <section id="pin-section" class="card">
      <h2 data-i18n="admin.pin_change"></h2>
      <form id="pin-form" class="fields">
        <label for="pin-current" data-i18n="admin.pin_current"></label>
        <input id="pin-current" type="password" autocomplete="current-password" required>
        <label for="pin-new" data-i18n="admin.pin_new"></label>
        <input id="pin-new" type="password" autocomplete="new-password" minlength="4" maxlength="64" required>
        <label for="pin-repeat" data-i18n="admin.pin_repeat"></label>
        <input id="pin-repeat" type="password" autocomplete="new-password" minlength="4" maxlength="64" required>
        <p class="hint" data-i18n="admin.pin_hint"></p>
        <button type="submit" data-i18n="admin.save"></button>
      </form>
    </section>
  </main>

  <footer>
    <span id="version"></span>
    <a id="source" href="https://github.com/onewaypub/Muckebox" rel="noopener" data-i18n="admin.source"></a>
  </footer>

  <template id="tile-row">
    <li class="tile-row">
      <img class="thumb" alt="">
      <form class="rename">
        <input name="title" maxlength="60" required>
        <button type="submit" class="secondary" data-i18n="admin.save"></button>
      </form>
      <span class="meta"></span>
      <div class="resume" hidden>
        <label class="check"><input class="resume-toggle" type="checkbox"> <span data-i18n="admin.resume"></span></label>
        <span class="resume-position"></span>
        <button type="button" class="link resume-restart" data-i18n="admin.resume_restart"></button>
      </div>
      <div class="actions">
        <button type="button" class="icon up" data-i18n-label="admin.up">▲</button>
        <button type="button" class="icon down" data-i18n-label="admin.down">▼</button>
        <label class="upload secondary"><span data-i18n="admin.cover"></span>
          <input type="file" accept="image/jpeg,image/png" hidden>
        </label>
        <button type="button" class="danger delete" data-i18n="admin.delete"></button>
      </div>
    </li>
  </template>

  <template id="day-row">
    <div class="day-row">
      <span class="day"></span>
      <input class="from" type="time" step="300" data-i18n-label="admin.from">
      <span aria-hidden="true">–</span>
      <input class="to" type="time" step="300" data-i18n-label="admin.to">
      <label class="check"><input class="free" type="checkbox"> <span data-i18n="admin.day_free"></span></label>
    </div>
  </template>

  <template id="game-row">
    <div class="game-row">
      <label class="check"><input class="game-enabled" type="checkbox"> <span class="game-name"></span></label>
      <select class="game-level" data-i18n-label="admin.game_level">
        <option value="1" data-i18n="admin.level_1"></option>
        <option value="2" data-i18n="admin.level_2"></option>
        <option value="3" data-i18n="admin.level_3"></option>
      </select>
      <p class="hint game-about"></p>
    </div>
  </template>

  <template id="room-row">
    <li class="room-row">
      <span class="name"><strong></strong><small></small></span>
      <button type="button" class="choose"></button>
    </li>
  </template>

  <template id="favorite-row">
    <li class="favorite-row">
      <img class="thumb" alt="">
      <span class="name"><strong></strong><small></small></span>
      <button type="button" class="add"></button>
    </li>
  </template>
</body>
</html>
