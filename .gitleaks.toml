#
# Secret and privacy scan for this public repository.
# Extends the gitleaks default rules with checks for private data that must
# never be published: home network addresses, email addresses, device IDs
# and PINs. Run it with scripts/check (or scripts/privacy_scan.py).
# The rules are tested in tests/test_privacy_rules.py.

title = "Muckebox secret and privacy scan"

[extend]
useDefault = true

[[rules]]
id = "private-ipv4"
description = "Private or CGNAT IPv4 address. Use 192.0.2.x, 198.51.100.x or 203.0.113.x in examples."
regex = '''\b(10\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.(?:1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|100\.(?:6[4-9]|[7-9]\d|1[01]\d|12[0-7])\.\d{1,3}\.\d{1,3})\b'''
tags = ["privacy"]

[[rules]]
id = "email-address"
description = "Email address. Use a noreply or example.com address."
regex = '''\b([A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,})\b'''
tags = ["privacy"]

  [[rules.allowlists]]
  regexes = [
    '''@users\.noreply\.github\.com$''',
    '''^noreply@(anthropic|github)\.com$''',
    '''@example\.(com|org|net)$''',
  ]

[[rules]]
id = "mac-address"
description = "MAC address. Use the documentation range 00:00:5E:00:53:xx."
regex = '''\b([0-9A-Fa-f]{2}(?:[:-][0-9A-Fa-f]{2}){5})\b'''
tags = ["privacy"]

  [[rules.allowlists]]
  regexes = [
    '''^00[:-]00[:-]5[Ee][:-]00[:-]53[:-][0-9A-Fa-f]{2}$''',
    '''^00([:-]00){5}$''',
  ]

[[rules]]
id = "sonos-player-id"
description = "Sonos player ID (contains the device MAC). Use RINCON_00005E005300 01400 style placeholders."
regex = '''\b(RINCON_[0-9A-Fa-f]{12}[0-9]{5})\b'''
keywords = ["rincon_"]
tags = ["privacy"]

  [[rules.allowlists]]
  regexes = ['''^RINCON_(000000000000|00005[Ee]0053[0-9A-Fa-f]{2})[0-9]{5}$''']

[[rules]]
id = "sonos-household-id"
description = "Sonos household ID."
regex = '''\b(Sonos_[A-Za-z0-9]{16,}(?:\.[A-Za-z0-9_-]+)?)'''
keywords = ["sonos_"]
tags = ["privacy"]

[[rules]]
id = "admin-pin"
description = "ADMIN_PIN with a concrete value. Use a placeholder such as change-me."
regex = '''ADMIN_PIN["']?\s*[:=]\s*["']?([^\s"'#]+)'''
secretGroup = 1
keywords = ["admin_pin"]
tags = ["privacy", "secret"]

  [[rules.allowlists]]
  description = "Placeholders and variable references"
  regexes = ['''^(\$\{?[A-Za-z_]+\}?|<[^>]*>|(?i:change[-_]?me)|YOUR_PIN|\.\.\.)$''']

  [[rules.allowlists]]
  description = "Test suites use obviously fake PINs"
  paths = ['''^tests/''']

[[allowlists]]
description = "Rule definitions and rule tests contain examples on purpose"
paths = [
  '''^\.gitleaks\.toml$''',
  '''^tests/test_privacy_rules\.py$''',
]
