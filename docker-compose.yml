#
# Muckebox on a NAS or any Docker host. See README.md ("Installation").
# Set "user:" below before the first start. Room, volume limit and PIN are
# set on the parents' page (/admin) and saved in ./data; on the first start
# the log shows a PIN for the first login.

services:
  muckebox:
    build: .
    image: muckebox:local
    container_name: muckebox
    restart: unless-stopped
    init: true

    # Host networking is needed because
    # - the room search on the parents' page uses multicast (SSDP), which
    #   does not pass through Docker's bridge network, and
    # - the tablets reach Muckebox directly on the host's address and PORT.
    # If you always enter a speaker's IP address on the parents' page, a
    # bridge network with "ports:" would also work.
    network_mode: host

    # The user and group that own the data folder on the host.
    # On Synology: the IDs of your DSM user (in SSH: `id <user>`),
    # often 1026:100 for the first user.
    user: "1026:100"

    environment:
      PORT: "8484"
      # Where Muckebox can be reached: all (the whole network, the default),
      # localhost (this computer only) or one IPv4 address of this host.
      # Remove the "#" to use it.
      # LISTEN: "all"
      TZ: "Europe/Berlin"

    volumes:
      # Create the folder "data" next to this file before the first start.
      - ./data:/data
