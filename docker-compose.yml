#
# Muckebox on a NAS or any Docker host. See README.md ("Installation").
# Replace the example values below before the first start.

services:
  muckebox:
    build: .
    image: muckebox:local
    container_name: muckebox
    restart: unless-stopped
    init: true

    # Host networking is needed because
    # - finding the speakers by room name uses multicast (SSDP), which does
    #   not pass through Docker's bridge network, and
    # - the tablets reach Muckebox directly on the host's address and PORT.
    # With SONOS_IP set, a bridge network with "ports:" would also work.
    network_mode: host

    # The user and group that own the data folder on the host.
    # On Synology: the IDs of your DSM user (in SSH: `id <user>`),
    # often 1026:100 for the first user.
    user: "1026:100"

    environment:
      # Room name as shown in the Sonos app, and/or the IP address of any
      # Sonos speaker (required if the speakers are in another VLAN).
      SONOS_ROOM: "Kids room"
      SONOS_IP: "192.0.2.10"
      # Highest volume the kids can reach (1-100) and the step per tap.
      MAX_VOLUME: "25"
      VOLUME_STEP: "3"
      # PIN for the parents' page (/admin). Without it the page stays locked.
      ADMIN_PIN: "change-me"
      PORT: "8484"
      TZ: "Europe/Berlin"

    volumes:
      # Create the folder "data" next to this file before the first start.
      - ./data:/data
