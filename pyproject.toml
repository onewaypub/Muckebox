[project]
name = "muckebox"
description = "Touch web UI that lets small children play music on a Sonos speaker"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.13"
version = "0.1.0.dev0"

[project.urls]
Source = "https://github.com/onewaypub/Muckebox"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "B",        # bugbear
  "UP",       # pyupgrade
  "S",        # flake8-bandit
  "SIM",      # simplify
  "RUF",      # ruff-specific
]

# Typographic characters used on purpose in texts and comments.
allowed-confusables = ["×", "–", "‘", "’"]

[tool.ruff.lint.per-file-ignores]
# Developer scripts and tests run fixed git/tool commands.
"scripts/**" = ["S603", "S607"]
# Tests may also assert.
"tests/**" = ["S101", "S104", "S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
markers = ["e2e: end-to-end tests in real browser engines (need Playwright browsers)"]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["muckebox"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
