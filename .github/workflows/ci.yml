name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: scripts/install-gitleaks
      - run: pytest --cov --cov-report=term
        env:
          MUCKEBOX_REQUIRE_GITLEAKS: "1"

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Unit tests of the browser logic
        run: node --test tests/js/*.test.mjs

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the image
        run: docker build -t muckebox:ci .
      - name: Start it with a simulated speaker and check that it answers
        run: |
          docker run -d --name muckebox -p 8484:8484 \
            -e MUCKEBOX_FAKE_SONOS=1 -e SONOS_IP=192.0.2.10 \
            muckebox:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8484/api/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8484/api/state | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:8484/ | grep -q 'manifest.webmanifest'
      - name: Stop it cleanly
        run: |
          docker stop -t 10 muckebox
          test "$(docker inspect muckebox --format '{{.State.ExitCode}}')" = 0
      - name: Show logs
        if: always()
        run: docker logs muckebox || true

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install --require-hashes -r requirements-dev.txt
      - name: bandit (static security analysis)
        run: bandit -q -c pyproject.toml -r muckebox
      - name: pip-audit (known vulnerabilities in runtime dependencies)
        run: pip-audit --strict --require-hashes --disable-pip -r requirements.txt

  privacy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the full history
          # For pull requests, scan the PR head instead of GitHub's synthetic
          # merge commit, which carries the PR opener's account email.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: scripts/install-gitleaks
      - name: Secret and private-data scan
        run: python scripts/privacy_scan.py
